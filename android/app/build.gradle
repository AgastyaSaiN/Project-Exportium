apply plugin: 'com.android.application'

import groovy.json.JsonSlurper

// The app version is the project's package.json version, so desktop and Android releases share one number.
// versionCode (what Google Play compares) is major*10000 + minor*100 + patch, e.g. 0.0.6 -> 6, 1.2.3 -> 10203.
// CI can override it with -PversionCode=NN if a version ever has to be uploaded twice.
def appPackage = new JsonSlurper().parse(file('../../package.json'))
def computedVersionCode = 1
def versionMatch = (appPackage.version =~ /^(\d+)\.(\d+)\.(\d+)/)
if (versionMatch.find()) {
    computedVersionCode = versionMatch.group(1).toInteger() * 10000 + versionMatch.group(2).toInteger() * 100 + versionMatch.group(3).toInteger()
}
def versionCodeOverride = project.hasProperty('versionCode') ? project.property('versionCode').toString().toInteger() : null

// Release signing. The keys never live in the repo: locally they come from android/keystore.properties (git-ignored),
// in CI from environment variables. Without either, the release build is simply left unsigned.
def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('keystore.properties')
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
}
def signingValue = { String property, String environment -> keystoreProperties.getProperty(property) ?: System.getenv(environment) }

android {
    namespace = "com.keicei.exportium"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.keicei.exportium"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode versionCodeOverride != null ? versionCodeOverride : computedVersionCode
        versionName appPackage.version
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            def storePath = signingValue('storeFile', 'EXPORTIUM_KEYSTORE_FILE')
            if (storePath) {
                storeFile rootProject.file(storePath)
                storePassword signingValue('storePassword', 'EXPORTIUM_KEYSTORE_PASSWORD')
                keyAlias signingValue('keyAlias', 'EXPORTIUM_KEY_ALIAS')
                keyPassword signingValue('keyPassword', 'EXPORTIUM_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            if (signingValue('storeFile', 'EXPORTIUM_KEYSTORE_FILE')) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
