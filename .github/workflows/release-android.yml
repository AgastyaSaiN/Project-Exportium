name: Android release

# Builds the signed Android App Bundle (.aab) that is uploaded to Google Play.
# Separate from the desktop release: it runs on `android-v*` tags only, so a desktop `v*` tag never triggers it.
#
# Release steps:
#   1. Set "version" in package.json (the Android versionName/versionCode come from it) and commit.
#   2. Tag it:  git tag android-v0.0.7   then   git push origin android-v0.0.7
#   3. Download the .aab from the finished run's "Artifacts" and upload it in Play Console.
#
# One-time setup (repository secrets): ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD,
# ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD. See android/play-store/RELEASING.md.

on:
  push:
    tags:
      - 'android-v*'
  workflow_dispatch:
  pull_request:
    paths:
      - 'android/**'
      - 'capacitor.config.ts'
      - '.github/workflows/release-android.yml'

permissions:
  contents: read

jobs:
  debug-build:
    # Pull requests that touch the Android project only prove that it still builds.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm run android:sync
      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

  bundle:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Check the tag matches package.json
        if: startsWith(github.ref, 'refs/tags/android-v')
        run: |
          tag="${GITHUB_REF_NAME#android-v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "Tag android-v$tag does not match package.json version $pkg" >&2
            exit 1
          fi

      - run: npm ci

      - name: Lint, typecheck and test
        run: |
          npm run lint
          npm run typecheck
          npm test

      - name: Build the web app and sync it into the Android project
        run: npm run android:sync

      - name: Decode the upload keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "ANDROID_KEYSTORE_BASE64 is not set; the bundle would be unsigned." >&2
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/exportium-upload.jks"

      - name: Build the release bundle
        working-directory: android
        env:
          EXPORTIUM_KEYSTORE_FILE: ${{ runner.temp }}/exportium-upload.jks
          EXPORTIUM_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          EXPORTIUM_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          EXPORTIUM_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew bundleRelease

      - name: Upload the bundle
        uses: actions/upload-artifact@v4
        with:
          name: exportium-android-${{ github.ref_name }}
          path: android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 30
          if-no-files-found: error
